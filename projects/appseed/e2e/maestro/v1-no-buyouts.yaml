# Version 1 ships without whole-app buyouts: no hub, no studio entry, no offers tab (lib/features.ts)
appId: app.vcseed.mobile
---
- launchApp
- extendedWaitUntil: # the opening loading page plays first
    notVisible:
      id: "launch-intro"
    timeout: 6000
- assertVisible: "排行榜"
- assertNotVisible: "買斷 App"
- tapOn: "創作"
- tapOn: "你想上架甚麼？"
- assertVisible: "模板"
- assertNotVisible: "出售整個 App"
- back
- tapOn: "已購"
- assertNotVisible: "報價"
