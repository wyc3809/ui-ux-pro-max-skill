# Categories and per-category leaderboards (§40): filter the board, open the category list, a vibe coding
# category's own board, its App Store parent, and the category picker in the launch wizard.
appId: app.vcseed.mobile
---
- launchApp
- extendedWaitUntil: # the opening loading page plays first
    notVisible:
      id: "launch-intro"
    timeout: 6000
- assertVisible: "排行榜"
- tapOn: "休閒小遊戲"
- assertVisible: "休閒小遊戲 · 今日第 1 名"
- tapOn: "所有類別"
- assertVisible: "Vibe coding 類別"
- tapOn: "記帳, .*"
- assertVisible: "新作排行榜"
- assertVisible: "夾錢易"
- tapOn: "屬於 App Store「財經」類別"
- assertVisible: "子類別"
- assertVisible: "夾錢易"
- scrollUntilVisible:
    element: "熱門付費模板"
- assertVisible: "Pocket Ledger 記帳本"
- back
- back
- back
- tapOn: "創作"
- tapOn: "你想上架甚麼？"
- tapOn: "推廣 App"
- tapOn: "主要類別: 選擇類別"
- scrollUntilVisible:
    element: "天氣"
- tapOn: "天氣"
- assertVisible: "主要類別: 天氣"
- tapOn: "次要類別（選填）: 不設定"
- tapOn: "工具程式"
- assertVisible: "次要類別（選填）: 工具程式"
