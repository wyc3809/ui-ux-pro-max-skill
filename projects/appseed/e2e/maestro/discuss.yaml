- tapOn: "發佈"
- assertVisible: "已發佈"
- assertVisible: "作者作品"
- tapOn: "熱門"
- tapOn: "讚好 86"
- assertVisible: "讚好 87"
- tapOn: "Moodboard AI 今日上架了.*"
- assertVisible: "討論串"
- assertVisible: "3 則回覆"
- tapOn: "回覆 Mint Loop"
- inputText: "動畫很順，想看製作經歷"
- tapOn: "發佈"
- assertVisible: "動畫很順，想看製作經歷"
- tapOn:
    label: "更多"
